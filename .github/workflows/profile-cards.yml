name: Refresh Profile Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v0.0.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: aspire488
          cards: contributions,composition,rhythm,languages
          output-dir: assets/profile
          themes: light,dark
          commit: false

      - name: Render live profile overview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile_overview.py

      - name: Render contribution history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile_activity.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile
          git diff --cached --quiet || git commit -m "chore(profile): refresh generated cards [skip ci]"
          git push
