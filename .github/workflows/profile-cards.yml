name: Refresh Profile Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time; a queued run waits instead of racing the previous run's push.
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: aspire488
          cards: overview,contributions,composition,rhythm,languages
          output-dir: assets/profile
          themes: light,dark
          commit: false

      # The renderers below write nothing on failure, so a failed step keeps its last committed SVGs
      # and must not block committing the cards above. The final step turns the run red instead.
      - name: Render contribution history
        id: activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile_activity.py

      - name: Render field atlas plates
        id: atlas
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile_atlas.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile
          git diff --cached --quiet || git commit -m "chore(profile): refresh generated cards [skip ci]"
          # A push to main can land while this run renders; replay this run's fresh SVGs on top of it.
          git push || { git pull --rebase -X theirs origin main && git push; }

      - name: Report skipped refresh
        if: steps.activity.outcome == 'failure' || steps.atlas.outcome == 'failure'
        run: |
          echo "::error::A renderer failed (activity: ${{ steps.activity.outcome }}, atlas: ${{ steps.atlas.outcome }}); its last committed SVGs were kept."
          exit 1
