name: Refresh Profile Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v0.0.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: aspire488
          cards: overview,lifetime,contributions,composition,rhythm,languages
          output-dir: assets/profile
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh generated cards [skip ci]"
