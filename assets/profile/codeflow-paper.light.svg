<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="title desc">
<title id="title">CodeFlow v1.1.0 — execution-first programming learning</title>
<desc id="desc">A developer learning workspace with a C editor, output preview, animated execution trace and shipped marker.</desc>
<style>
.rise{opacity:0;transform:translateY(9px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.trace{stroke-dasharray:7 7;animation:dash 1.6s linear infinite}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .55s cubic-bezier(.2,1.5,.4,1) 1.15s both}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes pulse{50%{opacity:.55}}
@keyframes stamp{from{opacity:0;transform:scale(1.35) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(-4deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="720" height="450" rx="16" fill="#f6f8fa"/>
<rect x="1" y="1" width="718" height="448" rx="15" fill="none" stroke="#d6e2ef"/>
<rect x="1" y="1" width="718" height="48" rx="15" fill="#ffffff"/>
<path d="M1 48H719" stroke="#d6e2ef"/>
<circle cx="23" cy="24" r="5" fill="#cf222e"/><circle cx="41" cy="24" r="5" fill="#9a6700"/><circle cx="59" cy="24" r="5" fill="#1a7f37"/>
<text x="84" y="30" fill="#59636e" font-family="ui-monospace,monospace" font-size="13">CODEFLOW / C BASICS / LOOP TRACE</text>
<g class="stamp"><rect x="535" y="13" width="164" height="30" rx="5" fill="none" stroke="#1a7f37" stroke-width="1.8"/><text x="617" y="33" fill="#1a7f37" font-family="ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SHIPPED v1.1.0</text></g>
<text x="28" y="88" fill="#1f2328" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750" class="rise">Learn by executing the logic.</text>
<text x="28" y="111" fill="#59636e" font-family="Inter,Arial,sans-serif" font-size="13" class="rise" style="animation-delay:.08s">Read it · predict it · trace it · prove you understand it</text>
<rect x="28" y="132" width="402" height="222" rx="10" fill="#ffffff" stroke="#d6e2ef" class="rise" style="animation-delay:.15s"/>
<path d="M28 169H430" stroke="#d6e2ef"/>
<text x="47" y="156" fill="#59636e" font-family="ui-monospace,monospace" font-size="12">main.c</text><circle cx="398" cy="151" r="3" fill="#1a7f37"/>
<g font-family="ui-monospace,monospace" font-size="15">
<g fill="#59636e" text-anchor="end"><text x="54" y="198">1</text><text x="54" y="225">2</text><text x="54" y="252">3</text><text x="54" y="279">4</text><text x="54" y="306">5</text><text x="54" y="333">6</text></g>
<text x="72" y="198" fill="#0969da">#include <tspan fill="#1f2328">&lt;stdio.h&gt;</tspan></text>
<text x="72" y="225" fill="#0969da">int <tspan fill="#1f2328">main</tspan><tspan fill="#59636e">() {</tspan></text>
<text x="96" y="252" fill="#9a6700">for</text><text x="124" y="252" fill="#1f2328">(int i = 1; i &lt;= 3; i++) {</text>
<text x="120" y="279" fill="#1a7f37">printf</text><text x="174" y="279" fill="#1f2328">("%d ", i);</text>
<text x="96" y="306" fill="#59636e">}</text><text x="72" y="333" fill="#59636e">}</text>
</g>
<rect x="70" y="237" width="336" height="23" rx="4" fill="#0969da" opacity=".10" class="pulse"/>
<rect x="448" y="132" width="244" height="105" rx="10" fill="#ffffff" stroke="#d6e2ef" class="rise" style="animation-delay:.28s"/>
<text x="466" y="157" fill="#59636e" font-family="ui-monospace,monospace" font-size="12">OUTPUT</text><circle cx="671" cy="153" r="4" fill="#1a7f37"/>
<text x="466" y="192" fill="#1a7f37" font-family="ui-monospace,monospace" font-size="24" font-weight="700">1 2 3</text>
<text x="466" y="216" fill="#59636e" font-family="ui-monospace,monospace" font-size="11">3 iterations · exit code 0</text>
<rect x="448" y="250" width="244" height="104" rx="10" fill="#ffffff" stroke="#d6e2ef" class="rise" style="animation-delay:.38s"/>
<text x="466" y="275" fill="#59636e" font-family="ui-monospace,monospace" font-size="12">EXECUTION TRACE</text>
<path d="M480 306H660" stroke="#d6e2ef" stroke-width="2"/><path d="M480 306H660" stroke="#0969da" stroke-width="2.5" class="trace"/>
<g font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">
<circle cx="486" cy="306" r="13" fill="#0969da"/><text x="486" y="310" fill="#fff">1</text>
<circle cx="570" cy="306" r="13" fill="#0969da"/><text x="570" y="310" fill="#fff">2</text>
<circle cx="654" cy="306" r="13" fill="#1a7f37"/><text x="654" y="310" fill="#fff">3</text>
<text x="486" y="338" fill="#59636e">i=1</text><text x="570" y="338" fill="#59636e">i=2</text><text x="654" y="338" fill="#59636e">i=3</text>
</g>
<path d="M28 374H692" stroke="#d6e2ef"/>
<g font-family="ui-monospace,monospace" font-size="12">
<rect x="28" y="390" width="120" height="34" rx="7" fill="#eef4fb" stroke="#d6e2ef"/><text x="88" y="411" text-anchor="middle" fill="#0969da">73 topics</text>
<rect x="158" y="390" width="150" height="34" rx="7" fill="#eef4fb" stroke="#d6e2ef"/><text x="233" y="411" text-anchor="middle" fill="#1a7f37">132 quiz Qs</text>
<rect x="318" y="390" width="150" height="34" rx="7" fill="#eef4fb" stroke="#d6e2ef"/><text x="393" y="411" text-anchor="middle" fill="#9a6700">11 screens</text>
<text x="692" y="411" fill="#59636e" text-anchor="end">C · HTML · CSS · JS</text>
</g>
</svg>