<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" width="720" height="378" role="img" aria-labelledby="t"><title id="t">RAG Platform, building, foundation first: SQLite with FTS5, a local Qdrant store and a MiniLM embedding wrapper are built but not wired together yet; MiniLM has only run against a stub. Planned on top: phase 4 ingest and chunk (next up), phase 5 hybrid search with RRF, phase 6 generation with providers off by default. Egress off by default; only /health so far.</title><style>.pop{animation:pop .45s ease-out both}@keyframes pop{from{opacity:0;transform:translateY(8px)}}.draw{stroke-dasharray:1;animation:draw .5s ease-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{opacity:0;transform:scale(1.8)}}.flow{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.nudge{animation:nudge 1.1s ease-in-out infinite alternate}@keyframes nudge{to{transform:translateX(-7px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 36H720" stroke="#232e3b" stroke-width="1"/><path d="M0 72H720" stroke="#232e3b" stroke-width="1"/><path d="M0 108H720" stroke="#232e3b" stroke-width="1"/><path d="M0 144H720" stroke="#232e3b" stroke-width="1"/><path d="M0 180H720" stroke="#232e3b" stroke-width="1"/><path d="M0 216H720" stroke="#232e3b" stroke-width="1"/><path d="M0 252H720" stroke="#232e3b" stroke-width="1"/><path d="M0 288H720" stroke="#232e3b" stroke-width="1"/><path d="M0 324H720" stroke="#232e3b" stroke-width="1"/><path d="M0 360H720" stroke="#232e3b" stroke-width="1"/><path d="M70 0V378" stroke="#6e3326" stroke-width="2"/><text x="92" y="72" fill="#f0f6fc" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="48" font-weight="700" class="pop" style="animation-delay:0.00s">RAG Platform</text><g transform="rotate(-4 622.5 44)"><g class="stamp" style="animation-delay:1.90s"><rect x="549" y="22" width="147" height="44" rx="4" fill="none" stroke="#ff7b5c" stroke-width="3"/><text x="622.5" y="52" fill="#ff7b5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">BUILDING</text></g></g><rect x="92" y="228" width="598" height="56" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.20s"/><rect x="108" y="245" width="22" height="22" rx="3" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.30s"/><path d="M111 256l6 7 13-16" pathLength="1" fill="none" stroke="#ff7b5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.55s"/><text x="140" y="265" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.30s">SQLite + FTS5</text><rect x="361" y="245" width="22" height="22" rx="3" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.50s"/><path d="M364 256l6 7 13-16" pathLength="1" fill="none" stroke="#ff7b5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.75s"/><text x="393" y="265" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.50s">Qdrant</text><rect x="510" y="245" width="22" height="22" rx="3" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.70s"/><path d="M513 256l6 7 13-16" pathLength="1" fill="none" stroke="#ff7b5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.95s"/><text x="542" y="265" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.70s">MiniLM</text><rect x="92" y="188" width="440" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" stroke-dasharray="6 5" class="pop" style="animation-delay:1.00s"/><text x="108" y="216" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.00s">4  ingest + chunk</text><rect x="92" y="148" width="440" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" stroke-dasharray="6 5" class="pop" style="animation-delay:1.25s"/><text x="108" y="176" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.25s">5  hybrid search + RRF</text><rect x="92" y="108" width="440" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" stroke-dasharray="6 5" class="pop" style="animation-delay:1.50s"/><text x="108" y="136" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.50s">6  generate, providers off</text><text x="690" y="176" fill="#9198a1" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" text-anchor="end" class="pop" style="animation-delay:1.60s">planned</text><g class="pop" style="animation-delay:1.70s"><g class="nudge"><text x="690" y="204" fill="#ff7b5c" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" text-anchor="end">← next up</text></g></g><text x="92" y="320" fill="#ff7b5c" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" class="pop" style="animation-delay:2.10s">built, but not wired together yet</text><text x="92" y="356" fill="#9198a1" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" class="pop" style="animation-delay:2.20s">egress off by default · only /health so far</text></svg>