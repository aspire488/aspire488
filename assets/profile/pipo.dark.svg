<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" width="720" height="414" role="img" aria-labelledby="t"><title id="t">Pipo's loop: you close the app, time passes, he builds, naps and heads out, you come back and he tells you what happened. No account, no analytics. Shipped as a v1.0 APK.</title><style>.pop{animation:pop .45s ease-out both}@keyframes pop{from{opacity:0;transform:translateY(8px)}}.draw{stroke-dasharray:1;animation:draw .5s ease-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{opacity:0;transform:scale(1.8)}}.flow{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.nudge{animation:nudge 1.1s ease-in-out infinite alternate}@keyframes nudge{to{transform:translateX(-7px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 36H720" stroke="#232e3b" stroke-width="1"/><path d="M0 72H720" stroke="#232e3b" stroke-width="1"/><path d="M0 108H720" stroke="#232e3b" stroke-width="1"/><path d="M0 144H720" stroke="#232e3b" stroke-width="1"/><path d="M0 180H720" stroke="#232e3b" stroke-width="1"/><path d="M0 216H720" stroke="#232e3b" stroke-width="1"/><path d="M0 252H720" stroke="#232e3b" stroke-width="1"/><path d="M0 288H720" stroke="#232e3b" stroke-width="1"/><path d="M0 324H720" stroke="#232e3b" stroke-width="1"/><path d="M0 360H720" stroke="#232e3b" stroke-width="1"/><path d="M0 396H720" stroke="#232e3b" stroke-width="1"/><path d="M70 0V414" stroke="#6e3326" stroke-width="2"/><text x="92" y="72" fill="#f0f6fc" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="48" font-weight="700" class="pop" style="animation-delay:0.00s">Pipo</text><g transform="rotate(-4 578.0 44)"><g class="stamp" style="animation-delay:1.60s"><rect x="460" y="22" width="236" height="44" rx="4" fill="none" stroke="#ff7b5c" stroke-width="3"/><text x="578.0" y="52" fill="#ff7b5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">SHIPPED · v1.0</text></g></g><rect x="92" y="92" width="284" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.20s"/><text x="108" y="120" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.20s">you close the app</text><path d="M116 134L116 158" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.35s"/><path d="M110 150L116 158L122 150" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.65s"/><rect x="92" y="164" width="195" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.50s"/><text x="108" y="192" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.50s">time passes</text><path d="M116 206L116 230" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.65s"/><path d="M110 222L116 230L122 222" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.95s"/><rect x="92" y="236" width="418" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.80s"/><text x="108" y="264" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.80s">he builds, naps, heads out</text><path d="M116 278L116 302" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.95s"/><path d="M110 294L116 302L122 294" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.25s"/><rect x="92" y="308" width="433" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:1.10s"/><text x="108" y="336" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.10s">you come back: he tells you</text><path d="M562 328H680V112H392" fill="none" stroke="#ff7b5c" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" class="flow"/><path d="M400 106L392 112L400 118" fill="none" stroke="#ff7b5c" stroke-width="2"/><text x="92" y="400" fill="#9198a1" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" class="pop" style="animation-delay:1.40s">no account, no analytics: a robot and a JSON file</text></svg>