<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-labelledby="title desc">
<title id="title">Joel Jigo — Software, systems, open source</title>
<desc id="desc">Minimal typographic banner with charcoal background, fine grid, strong typography, acid-green accent, and restrained project-domain index.</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c9d1d9" stroke-opacity=".055" stroke-width="1"/></pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c9ff68"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
  <clipPath id="clip"><rect width="1200" height="310" rx="8"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="310" fill="#0b0d10"/>
  <rect width="1200" height="310" fill="url(#grid)"/>
  <rect x="28" y="25" width="1144" height="260" fill="none" stroke="#6e7681" stroke-opacity=".38"/>
