<text x="89" y="130" font-family="monospace" font-size="10.5" letter-spacing="1.3" fill="#b6f8d7">BUILDING IN PUBLIC</text>
<text x="56" y="202" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="750" letter-spacing="-2.5" fill="#f2f1ff">Build things.</text>
<text x="56" y="265" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="750" letter-spacing="-2.5" fill="url(#mint)">Make them</text>
