<text x="766" y="246" fill="#a99aff">const</text><text x="797" y="246" fill="#d0d9ef"> build =</text><text x="843" y="246" fill="#a4f6ce"> async () =&gt; {</text>
<text x="766" y="262" fill="#8ea4c3">  plan();</text><text x="766" y="278" fill="#8ea4c3">  execute();</text><text x="766" y="294" fill="#8ea4c3">  verify();</text><text x="766" y="310" fill="#a4f6ce">  return "shipped";</text><text x="766" y="322" fill="#a99aff">};</text>
</g>
