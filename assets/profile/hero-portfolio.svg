  <text x="49" y="48" fill="#b9c0c9" font-family="monospace" font-size="11" letter-spacing="2.2">ASPIRE488 / PROFILE</text>
  <text x="1148" y="48" text-anchor="end" fill="#8b949e" font-family="monospace" font-size="10" letter-spacing="1.4">COMPUTER SCIENCE · OPEN SOURCE</text>
  <text x="53" y="153" fill="#f0f3f6" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="76" letter-spacing="-3.5">JOEL JIGO</text>
  <rect x="56" y="174" width="74" height="4" fill="url(#fade)"/>
  <text x="55" y="207" fill="#c7cdd5" font-family="Arial, Helvetica, sans-serif" font-size="18">Software engineering, developer tools &amp; systems.</text>
  <text x="55" y="238" fill="#8b949e" font-family="monospace" font-size="11.5" letter-spacing=".7">BUILD  /  VERIFY  /  CONTRIBUTE</text>
  <path d="M684 87V262" stroke="#6e7681" stroke-opacity=".42"/>
  <text x="722" y="101" fill="#8b949e" font-family="monospace" font-size="10" letter-spacing="2">FOCUS AREAS</text>
  <g font-family="monospace">
    <text x="722" y="139" fill="#b9c0c9" font-size="11">01</text><text x="766" y="139" fill="#f0f3f6" font-size="14" letter-spacing=".7">PRODUCT ENGINEERING</text><path d="M722 153H1135" stroke="#6e7681" stroke-opacity=".35"/>
    <text x="722" y="184" fill="#b9c0c9" font-size="11">02</text><text x="766" y="184" fill="#f0f3f6" font-size="14" letter-spacing=".7">DEVELOPER TOOLING</text><path d="M722 198H1135" stroke="#6e7681" stroke-opacity=".35"/>
    <text x="722" y="229" fill="#b9c0c9" font-size="11">03</text><text x="766" y="229" fill="#f0f3f6" font-size="14" letter-spacing=".7">OPEN-SOURCE SYSTEMS</text>
  </g>
  <text x="1148" y="265" text-anchor="end" fill="#a3e635" font-family="monospace" font-size="10" letter-spacing="1.2">KOCHI, INDIA</text>
  <rect x="1" y="1" width="1198" height="308" rx="8" fill="none" stroke="#8b949e" stroke-opacity=".35"/>
