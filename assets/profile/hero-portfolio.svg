<circle r="31" fill="url(#orb)" stroke="#9ceec8" stroke-opacity=".6"/><ellipse rx="43" ry="13" fill="none" stroke="#a6b5ff" stroke-width="1.6" transform="rotate(-22)"/><path d="M-17 -2l10-9 11 4 8 12-9 9-14-3Z" fill="#6ad4b3" opacity=".8"/><circle cx="10" cy="-12" r="3" fill="#efeaff"/><circle cx="-10" cy="15" r="2" fill="#a5a0ff"/><circle cx="-32" cy="-24" r="3" fill="#baff80" filter="url(#glow)"><animateMotion path="M0 0 A38 38 0 1 1 0.1 0" dur="7s" repeatCount="indefinite"/></circle>
</g>
<text x="1135" y="384" text-anchor="end" font-family="monospace" font-size="9" letter-spacing="1.5" fill="#657792">IDEAS → SYSTEMS → RELEASES</text>
