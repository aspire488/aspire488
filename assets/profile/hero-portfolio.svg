<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d">
<title id="t">Joel Jigo — builder of software and systems</title><desc id="d">A bespoke midnight-purple portfolio illustration with orbital shapes, a glowing laptop, floating project windows, and the message Build things. Make them hold up.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset=".52" stop-color="#17152d"/><stop offset="1" stop-color="#0c1822"/></linearGradient>
 <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa" stop-opacity=".92"/><stop offset=".55" stop-color="#7c5cff" stop-opacity=".27"/><stop offset="1" stop-color="#5ce2b0" stop-opacity=".1"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#baff80"/><stop offset="1" stop-color="#62edc4"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172b38"/><stop offset="1" stop-color="#111726"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#765aff" stop-opacity=".22"/><stop offset="1" stop-color="#765aff" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a8b8db" opacity=".22"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".36"/></filter>
 <clipPath id="round"><rect width="1200" height="430" rx="20"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1200" height="430" rx="20" fill="url(#bg)"/><rect width="1200" height="430" fill="url(#dots)"/><ellipse cx="900" cy="220" rx="390" ry="290" fill="url(#haze)"/>
