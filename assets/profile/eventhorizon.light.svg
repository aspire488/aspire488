<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" width="720" height="378" role="img" aria-labelledby="t"><title id="t">Event Horizon, shipped and live: a cosmic physics sandbox in the browser. Drop a black hole, set off a supernova, throw a planet into orbit, then rewind, undo or save. 7 tools, 6 worlds. 46 unit tests and 18 browser checks pass. The app still calls itself GOD MODE.</title><style>.pop{animation:pop .45s ease-out both}@keyframes pop{from{opacity:0;transform:translateY(8px)}}.draw{stroke-dasharray:1;animation:draw .5s ease-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{opacity:0;transform:scale(1.8)}}.flow{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.nudge{animation:nudge 1.1s ease-in-out infinite alternate}@keyframes nudge{to{transform:translateX(-7px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 36H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 72H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 108H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 144H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 180H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 216H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 252H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 288H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 324H720" stroke="#d6e2ef" stroke-width="1"/><path d="M0 360H720" stroke="#d6e2ef" stroke-width="1"/><path d="M70 0V378" stroke="#e3a090" stroke-width="2"/><text x="92" y="72" fill="#1f2328" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="48" font-weight="700" class="pop" style="animation-delay:0.00s">Event Horizon</text><g transform="rotate(-4 578.0 268)"><g class="stamp" style="animation-delay:1.90s"><rect x="460" y="246" width="236" height