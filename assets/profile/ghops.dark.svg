<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" width="720" height="378" role="img" aria-labelledby="t"><title id="t">gh-ops: six jobs, daily, monitoring, weekly-report, oss-hunt, security and status, through one dispatcher, sending a Telegram ping only when something happened. Frozen after 1,495 tests.</title><style>.pop{animation:pop .45s ease-out both}@keyframes pop{from{opacity:0;transform:translateY(8px)}}.draw{stroke-dasharray:1;animation:draw .5s ease-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{opacity:0;transform:scale(1.8)}}.flow{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.nudge{animation:nudge 1.1s ease-in-out infinite alternate}@keyframes nudge{to{transform:translateX(-7px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 36H720" stroke="#232e3b" stroke-width="1"/><path d="M0 72H720" stroke="#232e3b" stroke-width="1"/><path d="M0 108H720" stroke="#232e3b" stroke-width="1"/><path d="M0 144H720" stroke="#232e3b" stroke-width="1"/><path d="M0 180H720" stroke="#232e3b" stroke-width="1"/><path d="M0 216H720" stroke="#232e3b" stroke-width="1"/><path d="M0 252H720" stroke="#232e3b" stroke-width="1"/><path d="M0 288H720" stroke="#232e3b" stroke-width="1"/><path d="M0 324H720" stroke="#232e3b" stroke-width="1"/><path d="M0 360H720" stroke="#232e3b" stroke-width="1"/><path d="M70 0V378" stroke="#6e3326" stroke-width="2"/><text x="92" y="72" fill="#f0f6fc" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="48" font-weight="700" class="pop" style="animation-delay:0.00s">gh-ops</text><g transform="rotate(-4 637.5 44)"><g class="stamp" style="animation-delay:1.90s"><rect x="579" y="22" width="117" height="44" rx="4" fill="none" stroke="#ff7b5c" stroke-width="3"/><text x="637.5" y="52" fill="#ff7b5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">FROZEN</text></g></g><rect x="92" y="90" width="102" height="38" rx="19" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.15s"/><text x="106" y="117" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.15s">daily</text><rect x="206" y="90" width="176" height="38" rx="19" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.27s"/><text x="220" y="117" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.27s">monitoring</text><rect x="394" y="90" width="221" height="38" rx="19" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.39s"/><text x="408" y="117" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.39s">weekly-report</text><rect x="92" y="140" width="147" height="38" rx="19" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.51s"/><text x="106" y="167" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.51s">oss-hunt</text><rect x="251" y="140" width="147" height="38" rx="19" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.63s"/><text x="265" y="167" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.63s">security</text><rect x="410" y="140" width="117" height="38" rx="19" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.75s"/><text x="424" y="167" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.75s">status</text><path d="M116 178L116 200" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.90s"/><path d="M110 192L116 200L122 192" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.20s"/><text x="142" y="210" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.10s">one dispatcher, same in CI and locally</text><path d="M116 220L116 252" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.30s"/><path d="M110 244L116 252L122 244" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.60s"/><text x="142" y="282" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.50s">Telegram ping, only if something happened</text><text x="92" y="344" fill="#ff7b5c" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" class="pop" style="animation-delay:1.70s">1,495 tests, then I froze it</text></svg>