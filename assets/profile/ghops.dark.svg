<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="t"><title id="t">gh-ops with Kestrel, shipped: it watches my GitHub, keeps only what matters, diagnoses a red build down to the failing step, then pings me on Telegram, and I can just ask it things. 1,674 tests.</title><style>.pop{animation:pop .45s ease-out both}@keyframes pop{from{opacity:0;transform:translateY(8px)}}.draw{stroke-dasharray:1;animation:draw .5s ease-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{opacity:0;transform:scale(1.8)}}.flow{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.nudge{animation:nudge 1.1s ease-in-out infinite alternate}@keyframes nudge{to{transform:translateX(-7px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 36H720" stroke="#232e3b" stroke-width="1"/><path d="M0 72H720" stroke="#232e3b" stroke-width="1"/><path d="M0 108H720" stroke="#232e3b" stroke-width="1"/><path d="M0 144H720" stroke="#232e3b" stroke-width="1"/><path d="M0 180H720" stroke="#232e3b" stroke-width="1"/><path d="M0 216H720" stroke="#232e3b" stroke-width="1"/><path d="M0 252H720" stroke="#232e3b" stroke-width="1"/><path d="M0 288H720" stroke="#232e3b" stroke-width="1"/><path d="M0 324H720" stroke="#232e3b" stroke-width="1"/><path d="M0 360H720" stroke="#232e3b" stroke-width="1"/><path d="M0 396H720" stroke="#232e3b" stroke-width="1"/><path d="M0 432H720" stroke="#232e3b" stroke-width="1"/><path d="M70 0V450" stroke="#6e3326" stroke-width="2"/><text x="92" y="72" fill="#f0f6fc" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="48" font-weight="700" class="pop" style="animation-delay:0.00s">gh-ops</text><g transform="rotate(-4 630.0 44)"><g class="stamp" style="animation-delay:1.90s"><rect x="564" y="22" width="132" height="44" rx="4" fill="none" stroke="#ff7b5c" stroke-width="3"/><text x="630.0" y="52" fill="#ff7b5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">SHIPPED</text></g></g><text x="92" y="104" fill="#9198a1" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" class="pop" style="animation-delay:0.10s">+ Kestrel, my GitHub sidekick</text><rect x="92" y="128" width="284" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.30s"/><text x="108" y="156" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.30s">watches my GitHub</text><path d="M116 170L116 194" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.45s"/><path d="M110 186L116 194L122 186" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.75s"/><rect x="92" y="200" width="299" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.60s"/><text x="108" y="228" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.60s">keeps what matters</text><path d="M116 242L116 266" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.75s"/><path d="M110 258L116 266L122 258" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.05s"/><rect x="92" y="272" width="374" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.90s"/><text x="108" y="300" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.90s">diagnoses the red build</text><path d="M116 314L116 338" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.05s"/><path d="M110 330L116 338L122 330" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.35s"/><rect x="92" y="344" width="329" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:1.20s"/><text x="108" y="372" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.20s">pings me on Telegram</text><path d="M437 364H680V148H392" fill="none" stroke="#ff7b5c" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" class="flow"/><path d="M400 142L392 148L400 154" fill="none" stroke="#ff7b5c" stroke-width="2"/><text x="92" y="436" fill="#ff7b5c" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" class="pop" style="animation-delay:1.70s">1,674 tests, and it talks back now</text></svg>