<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="t"><title id="t">UEA: a task goes to a keyword classifier, then a specialist, then verify; unknown tasks go to an optional local model. Verification tiers minimal, standard, strict, security, full.</title><style>.pop{animation:pop .45s ease-out both}@keyframes pop{from{opacity:0;transform:translateY(8px)}}.draw{stroke-dasharray:1;animation:draw .5s ease-out both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{opacity:0;transform:scale(1.8)}}.flow{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.nudge{animation:nudge 1.1s ease-in-out infinite alternate}@keyframes nudge{to{transform:translateX(-7px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 36H720" stroke="#232e3b" stroke-width="1"/><path d="M0 72H720" stroke="#232e3b" stroke-width="1"/><path d="M0 108H720" stroke="#232e3b" stroke-width="1"/><path d="M0 144H720" stroke="#232e3b" stroke-width="1"/><path d="M0 180H720" stroke="#232e3b" stroke-width="1"/><path d="M0 216H720" stroke="#232e3b" stroke-width="1"/><path d="M0 252H720" stroke="#232e3b" stroke-width="1"/><path d="M0 288H720" stroke="#232e3b" stroke-width="1"/><path d="M0 324H720" stroke="#232e3b" stroke-width="1"/><path d="M0 360H720" stroke="#232e3b" stroke-width="1"/><path d="M0 396H720" stroke="#232e3b" stroke-width="1"/><path d="M0 432H720" stroke="#232e3b" stroke-width="1"/><path d="M70 0V450" stroke="#6e3326" stroke-width="2"/><text x="92" y="72" fill="#f0f6fc" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="48" font-weight="700" class="pop" style="animation-delay:0.00s">UEA</text><g transform="rotate(-4 645.0 44)"><g class="stamp" style="animation-delay:1.80s"><rect x="594" y="22" width="102" height="44" rx="4" fill="none" stroke="#ff7b5c" stroke-width="3"/><text x="645.0" y="52" fill="#ff7b5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">ALPHA</text></g></g><rect x="92" y="92" width="91" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.20s"/><text x="108" y="120" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.20s">task</text><path d="M116 134L116 158" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.35s"/><path d="M110 150L116 158L122 150" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.65s"/><rect x="92" y="164" width="299" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.50s"/><text x="108" y="192" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.50s">keyword classifier</text><path d="M116 206L116 230" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.65s"/><path d="M110 222L116 230L122 222" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.95s"/><rect x="92" y="236" width="180" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:0.80s"/><text x="108" y="264" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:0.80s">specialist</text><path d="M116 278L116 302" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.95s"/><path d="M110 294L116 302L122 294" pathLength="1" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.25s"/><rect x="92" y="308" width="121" height="40" rx="6" fill="none" stroke="#656c76" stroke-width="2" class="pop" style="animation-delay:1.10s"/><text x="108" y="336" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.10s">verify</text><path d="M399 184L447 184" pathLength="1" fill="none" stroke="#ff7b5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:0.90s"/><path d="M439 178L447 184L439 190" pathLength="1" fill="none" stroke="#ff7b5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.20s"/><text x="455" y="192" fill="#ff7b5c" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" class="pop" style="animation-delay:1.10s">unknown?</text><text x="455" y="220" fill="#ff7b5c" font-family="Georgia, 'Noto Serif', 'DejaVu Serif', 'Times New Roman', serif" font-size="24" font-style="italic" class="pop" style="animation-delay:1.20s">ask a small local model</text><text x="92" y="400" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.40s">tiers: minimal → standard → strict</text><text x="92" y="436" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" class="pop" style="animation-delay:1.50s">       → security → full</text></svg>