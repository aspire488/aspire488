<path d="M28 72H1172" stroke="#7390a8" stroke-opacity=".35"/>
<circle cx="49" cy="49" r="4" fill="#ff6d7e"/><circle cx="64" cy="49" r="4" fill="#ffd166"/><circle cx="79" cy="49" r="4" fill="#43f3a1"/>
<text x="98" y="53" font-family="monospace" font-size="12" letter-spacing="2" fill="#9bb2c8">ASPIRE488 / ENGINEERING LOG</text>
<text x="1115" y="53" text-anchor="end" font-family="monospace" font-size="11" fill="#43f3a1">● SYSTEM ONLINE</text>
<text x="64" y="124" font-family="monospace" font-size="12" letter-spacing="3" fill="#43f3a1">SOFTWARE BUILDER · OPEN SOURCE</text>
<text x="60" y="181" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#f2f7fb">JOEL JIGO</text>
<text x="64" y="216" font-family="monospace" font-size="15" fill="#a8bdd0">I build tools, products, and systems that hold up.</text>
<path d="M64 242H540" stroke="url(#line)" stroke-width="2"/>
<text x="64" y="273" font-family="monospace" font-size="12" fill="#7f9bb1">CURRENT OPERATING PRINCIPLES</text>
<text x="64" y="301" font-family="monospace" font-size="13" fill="#d7e5f0">[01] deterministic by design</text>
<text x="64" y="324" font-family="monospace" font-size="13" fill="#d7e5f0">[02] verified, not assumed</text>
<text x="64" y="347" font-family="monospace" font-size="13" fill="#d7e5f0">[03] ship → learn → improve</text>
<g transform="translate(710 104)">
<text x="0" y="0" font-family="monospace" font-size="11" letter-spacing="2" fill="#829db5">SYSTEM MAP / 06 NODES</text>
