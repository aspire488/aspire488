<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Joel Jigo — Engineering systems, shipping software</title>
<desc id="desc">A custom dark engineering-console illustration with animated signal paths, project architecture nodes, and an identity panel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d17"/><stop offset=".55" stop-color="#101b2b"/><stop offset="1" stop-color="#0a121c"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43f3a1"/><stop offset=".55" stop-color="#63c8ff"/><stop offset="1" stop-color="#9b8cff"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8ab3d0" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="388" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="390" rx="18" fill="url(#bg)"/><rect width="1200" height="390" fill="url(#grid)"/>
<path d="M760 -30L470 390M910 -30L620 390M1060 -30L770 390" stroke="#5db6e8" stroke-opacity=".07" stroke-width="1"/>
