<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">CodeFlow architecture</title><desc id="desc">Browser UI flows through modules and execution engines into state and visualization.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0"/><stop offset="1" stop-color="#70a5fd"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="420" rx="28" fill="#0d1117"/>
<text x="60" y="62" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">CodeFlow — execution-first learning architecture</text>
<text x="60" y="94" fill="#9da7b3" font-family="Arial,sans-serif" font-size="16">Prototype pipeline: user intent → execution model → state transitions → visualization</text>
<g filter="url(#s)" font-family="Arial,sans-serif" text-anchor="middle">
<rect x="55" y="150" width="190" height="105" rx="18" fill="#161b22" stroke="#70a5fd" stroke-width="2"/><text x="150" y="190" fill="#fff" font-size="20" font-weight="700">UI</text><text x="150" y="218" fill="#9da7b3" font-size="14">Lessons · Quiz · Games</text>
<rect x="285" y="150" width="190" height="105" rx="18" fill="#161b22" stroke="#70a5fd" stroke-width="2"/><text x="380" y="190" fill="#fff" font-size="20" font-weight="700">Modules</text><text x="380" y="218" fill="#9da7b3" font-size="14">Feature orchestration</text>
<rect x="515" y="150" width="190" height="105" rx="18" fill="#161b22" stroke="#70a5fd" stroke-width="2"/><text x="610" y="190" fill="#fff" font-size="20" font-weight="700">Engines</text><text x="610" y="218" fill="#9da7b3" font-size="14">Execution · Quiz · Tests</text>
<rect x="745" y="150" width="190" height="105" rx="18" fill="#161b22" stroke="#70a5fd" stroke-width="2"/><text x="840" y="190" fill="#fff" font-size="20" font-weight="700">State</text><text x="840" y="218" fill="#9da7b3" font-size="14">Variables · Output · History</text>
<rect x="975" y="150" width="170" height="105" rx="18" fill="#161b22" stroke="#70a5fd" stroke-width="2"/><text x="1060" y="190" fill="#fff" font-size="20" font-weight="700">Renderer</text><text x="1060" y="218" fill="#9da7b3" font-size="14">Step-by-step view</text>
</g>
<g stroke="#70a5fd" stroke-width="3" fill="none"><path d="M245 202h40"/><path d="M475 202h40"/><path d="M705 202h40"/><path d="M935 202h40"/></g>
<g fill="#70a5fd"><path d="M285 202l-10-7v14z"/><path d="M515 202l-10-7v14z"/><path d="M745 202l-10-7v14z"/><path d="M975 202l-10-7v14z"/></g>
<rect x="180" y="315" width="840" height="58" rx="16" fill="url(#g)" opacity=".16" stroke="#70a5fd"/>
<text x="600" y="351" fill="#dbeafe" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Design goal: make program execution observable instead of asking learners to mentally simulate it.</text>
</svg>
